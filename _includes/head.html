<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">
<meta name="theme-color" content="#005f73">

<title>
  {% if page.title and page.permalink != '/' %}{{ page.title }} | {% endif %}{{ site.title }}
</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>">
<link rel="stylesheet" href="{{ '/assets/css/bootstrap.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
